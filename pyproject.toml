[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rakshpulse"
version = "5.2.0"
description = "RakshPulse: research platform for cuffless BP estimation from red/IR PPG (MAX30102)"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE"]
dependencies = [
  # enough for data preparation, preprocessing, features, ridge/SVR/forest models and inference
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.scripts]
rakshpulse = "rakshpulse.cli:main"

[project.optional-dependencies]
train = ["xgboost>=2.0", "lightgbm>=4.0"]  # gradient-boosting candidates of the complete pipeline
data = ["wfdb>=4.1", "openpyxl>=3.1"]  # readers for the public raw datasets (WFDB, Excel)
serial = ["pyserial>=3.5"]  # live MAX30102 input over USB serial
notebook = ["jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
deep = ["torch>=2.2"]  # raw-waveform research models (CNN, GRU, TCN, Transformer)
vitaldb = ["vitaldb>=1.4"]  # MIT-licensed .vital reader, only for the VitalDB adapter
dev = ["pytest>=8", "ruff>=0.5", "pyserial>=3.5", "rakshpulse[train,data]"]  # pyserial: loop:// serial tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff.lint.per-file-ignores]
# dataset URLs, titles and citations are kept verbatim on one line
"src/rakshpulse/data/download.py" = ["E501"]
"src/rakshpulse/data/physionet.py" = ["E501"]
# Markdown table generator: long f-string rows are clearer unwrapped
"scripts/write_session1_tables.py" = ["E501"]
