[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakshpulse"
version = "0.1.0"
description = "RakshPulse ML: research pipeline for cuffless BP estimation from red/IR PPG"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "wfdb>=4.1",
  "lightgbm>=4.0",
]

[project.scripts]
rakshpulse = "rakshpulse.cli:main"

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]
vitaldb = ["vitaldb>=1.4"]
serial = ["pyserial>=3.5"]  # only for SerialSource (USB-serial MAX30102 bridge)  # MIT-licensed .vital reader, only for the VitalDB adapter

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff.lint.per-file-ignores]
# dataset URLs, titles and citations are kept verbatim on one line
"src/rakshpulse/data/download.py" = ["E501"]
"src/rakshpulse/data/physionet.py" = ["E501"]
# Markdown table generator: long f-string rows are clearer unwrapped
"scripts/write_session1_tables.py" = ["E501"]
